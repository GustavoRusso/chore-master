<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Home — Chore Master</title>
  </head>
  <body>
    <h1>Welcome{% if user.is_authenticated %}, {{ user.get_short_name|default:user.username }}{% endif %}</h1>
    <p>You are signed in.</p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  </body>
</html>
