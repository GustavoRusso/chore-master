<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sign-in error — Chore Master</title>
  </head>
  <body>
    <h1>Sign-in did not work</h1>
    <p>Google Sign-In failed. You are not signed in.</p>
    {% if auth_error %}
      <p>{{ auth_error.code }}</p>
    {% endif %}
    <p><a href="{% url 'login' %}">Return to the login page</a></p>
  </body>
</html>
