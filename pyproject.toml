[project]
name = "chore-master"
version = "0.1.0"
description = "Family chore planner built with Django and HTMX"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6",
    "django-allauth[socialaccount]>=65.19.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
